openapi: 3.0.0
info:
  title: Pokémon Card API
  version: 1.0.0
servers:
  - url: http://localhost:3000

paths:
  /pokemon-cards:
    get:
      tags: [PokemonCard]
      summary: Récupère toutes les cartes
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PokemonCard"
    post:
      tags: [PokemonCard]
      summary: Crée une carte
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PokemonCardInput"
      responses:
        "201":
          description: Créée
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pokemon-cards/bulk:
    post:
      tags: [PokemonCard]
      summary: Crée plusieurs cartes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: "#/components/schemas/PokemonCardInput"
      responses:
        "201":
          description: Créées
        "401":
          $ref: "#/components/responses/Unauthorized"

  /pokemon-cards/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [PokemonCard]
      summary: Récupère une carte
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PokemonCard"
        "404":
          description: Non trouvée
    put:
      tags: [PokemonCard]
      summary: Modifie une carte
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PokemonCardInput"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PokemonCard"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [PokemonCard]
      summary: Supprime une carte
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Supprimée
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      tags: [User]
      summary: Récupère tous les utilisateurs
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [User]
      summary: Crée un utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "201":
          description: Créé

  /users/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [User]
      summary: Récupère un utilisateur
      security:
        - bearerAuth: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /auth/login:
    post:
      tags: [Authentification]
      summary: Connexion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Credentials"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          description: Identifiants incorrects
        "500":
          description: Erreur serveur

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Unauthorized:
      description: Non autorisé

  schemas:
    PokemonCard:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Pikachu
        pokedexId:
          type: integer
          example: 25
        typeId:
          type: integer
          example: 3
        lifePoints:
          type: integer
          example: 60
        size:
          type: number
          example: 0.4
        weight:
          type: number
          example: 6.0
        imageUrl:
          type: string
          example: https://assets.pokemon.com/assets/cms2/img/pokedex/full/025.png

    PokemonCardInput:
      type: object
      required: [name, pokedexId, typeId, lifePoints]
      properties:
        name:
          type: string
        pokedexId:
          type: integer
        typeId:
          type: integer
        lifePoints:
          type: integer
        size:
          type: number
        weight:
          type: number
        imageUrl:
          type: string

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: ash@pokemon.com

    Credentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          example: ash@pokemon.com
        password:
          type: string
          example: pikachu123